[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-autonomous-engineer"
version = "0.1.0"
description = "Autonomous software-engineering runtime with explicit workspace and tool boundaries"
requires-python = ">=3.11"

[project.optional-dependencies]
openai = ["openai>=1.0,<3"]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
